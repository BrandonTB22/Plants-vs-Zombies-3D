<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plants Vs Zombies</title>
    <style>
        body{
            margin: 0;
            overflow: hidden;
        }
        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 24px;
            background-color: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        #startButton:hover {
            background-color: #444;
        }
        
    </style>
</head>
<body>

    <div id="gui">
        <div id="sunEnergy">
            <span id="sunText">0</span>
        </div>
        <div id="plantSlots">
            <!-- Plant slots -->
            <div class="plantBox"></div>
            <div class="plantBox"></div>
            <div class="plantBox"></div>
            <div class="plantBox"></div>
            <div class="plantBox"></div>
            <div class="plantBox"></div>
            <div class="plantBox"></div>
            <div class="plantBox"></div>
        </div>
        <div id="shovel">
            <img src="shovel_icon.png" alt="Shovel" />
        </div>
    </div>
    <style>
        /* GUI Container */
        #gui {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8); /* Semi-transparent black */
            border: 2px solid #555;
            border-radius: 10px;
            padding: 10px;
            width: 400px; /* Adjust as needed */
            height: 60px;
        }
    
        /* Sun Energy Circle */
        #sunEnergy {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #ffcc00; /* Sun yellow */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-right: 10px;
            box-shadow: 0px 0px 10px 2px #ffcc00;
        }
    
        #sunText {
            user-select: none; /* Prevent text selection */
        }
    
        /* Plant Seed Boxes */
        #plantSlots {
            display: grid;
            grid-template-columns: repeat(8, 1fr); /* 8 equally spaced columns */
            gap: 5px;
            margin-right: 10px;
        }
    
        .plantBox {
            width: 40px;
            height: 40px;
            background-color: #228B22; /* Green for empty slot */
            border: 2px solid #fff;
            border-radius: 5px;
        }
    
        /* Shovel Icon */
        #shovel {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #888; /* Neutral color for shovel */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
    
        #shovel img {
            width: 40px;
            height: 40px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
    <button id="startButton">Begin Game</button>
    
    <canvas id="myCanvas"></canvas>

    <script type="module">
// Include all of the imports needed
import THREE from './threejsModule.js';
import {SoundHandler} from './SoundHandler.js';
import {Lawn} from './Lawn.js';
import {House} from './House.js';
import {Plant} from './Plants/Plant.js';
import {Peashooter} from './Plants/Peashooter.js';
// import {BasicZombie} from './Zombies/BasicZombie.js'
import {SpawnLocation} from './Zombies/SpawnLocation.js';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'; // Used for models
import { loadBasicZombie } from './Zombies/BasicZombie.js'; // Import the model file of basic zombie

// Set up the camera, scene, and renderer
var scene = new THREE.Scene();

var camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, .1, 3000 );
camera.position.set(30, 30, -15);
camera.lookAt( new THREE.Vector3(30, -10, 15));
scene.add( camera );

var renderer = new THREE.WebGLRenderer({canvas: myCanvas, antialias: true});
renderer.setClearColor(0x000000);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

var light = new THREE.AmbientLight(0xffffff);
scene.add(light);

// Load the audio

const listener = new THREE.AudioListener();
camera.add(listener);

const audioLoader = new THREE.AudioLoader();
const music = new THREE.Audio(listener);

audioLoader.load('./SoundFiles/ModernDay(First Wave).mp3', (buffer) => {
    music.setBuffer(buffer);
    music.setLoop(true);
    music.setVolume(0);
    music.play();
});

// Handle the start button being clicked
const startButton = document.getElementById('startButton');
startButton.addEventListener('click', () => {
    startButton.style.display = 'none'; // Hide the button after it has been clicked

    camera.position.set(30, 50, 80);
    camera.lookAt( new THREE.Vector3(camera.position.x,0.0,0.0));
    // Play start sound effect

    //l

});

/*
// Test plant
let model;
const modelLoader = new GLTFLoader();
modelLoader.load('peashooter.glb',
        (gltf) => {
            model = gltf.scene;
            scene.add(model);

            model.position.set(0, 5, 0);
            model.scale.set(10, 10, 10);
            model.rotateY(1.5);
        },
            (xhr) => {
                console.log('Model ${(xhr.loaded / xhr.total * 100).toFixed(2)}% loaded')
        },
            (error) => {
                console.log('There was an error:', error);
        });

*/
// Add a peashooter in
var peashooter = new Peashooter('peashooter', 100);
var generatePeashooter = peashooter.generatePlant();
var generatePeashooterDetection = peashooter.generateDetectionZone();
scene.add(generatePeashooter);
// scene.add(generatePeashooterDetection);

// Add the zombie
/*
var zombie = new BasicZombie('basicZombie', 100);
var generateBasicZombie = zombie.generateZombie();
var zomBox = zombie.createBoundingBox();
scene.add(generateBasicZombie);
*/

// peashooter.detectIntersection(zomBox);

// Texture Loader
var texLoader = new THREE.TextureLoader();
var grass1 = texLoader.load('Textures/grass1.jpg');
var grass2 = texLoader.load('Textures/grass2.jpg');

// Add the lawn to the scene
var lawn = new Lawn(grass1, grass2, 8, 8, 8);
var lawnGeneration = lawn.generateLawn();

// Add the house to the scene
var house = new House([64, 8, 64], 0xdbd6c8, [-36, 0, 16]);
var houseGeneration = house.generateHouse();
scene.add(houseGeneration);

// Add the zombie spawn location to the scene
var spawn = new SpawnLocation();
var generateSpawn = spawn.generateSpawnLocation();
scene.add(generateSpawn);


for (let i = 0; i < lawnGeneration.length; i++){
    scene.add(lawnGeneration[i]);
}

let updateAnimation; // This will hold the animation update function
const clock = new THREE.Clock(); // Create a clock to track time for smooth animations

// Load the zombie model and get the animation update function
loadBasicZombie(scene).then((updateFn) => {
    updateAnimation = updateFn; // Assign the update function when the promise resolves
}).catch((error) => {
    console.error("Error loading the zombie:", error);
});

// Animation loop
function animate() {
    requestAnimationFrame(animate); // Request the next frame

    const delta = clock.getDelta(); // Get the time delta for the frame
    if (updateAnimation) updateAnimation(delta); // Call the update function if available

    renderer.render(scene, camera); // Render the scene
}

animate(); // Start the animation loop

    </script>
</body>
</html>
